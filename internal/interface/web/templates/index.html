{{ define "index.html" }}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fighting Fantasy</title>
	<script src="https://unpkg.com/htmx.org@1.9.10"></script>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, sans-serif;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #1a1a2e;
			color: #eee;
		}

		.container {
			max-width: 400px;
			width: 100%;
			padding: 2rem;
		}

		h1 {
			text-align: center;
			margin-bottom: 2rem;
			color: #e94560;
		}

		.auth-buttons {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		button {
			padding: 0.75rem 1.5rem;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 1rem;
			transition: background 0.2s;
		}

		.btn-login {
			background: #e94560;
			color: white;
		}

		.btn-login:hover {
			background: #ff6b6b;
		}

		.btn-register {
			background: transparent;
			border: 2px solid #e94560;
			color: #e94560;
		}

		.btn-register:hover {
			background: #e94560;
			color: white;
		}

		#auth-form {
			margin-top: 2rem;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>Fighting Fantasy</h1>
		<div class="auth-buttons">
			<button class="btn-login" hx-get="/login-form" hx-target="#auth-form"
				hx-swap="innerHTML">Login</button>
			<button class="btn-register" hx-get="/register-form" hx-target="#auth-form"
				hx-swap="innerHTML">Sign Up</button>
		</div>
		<div id="auth-form"></div>
	</div>
</body>

</html>
{{ end }}
