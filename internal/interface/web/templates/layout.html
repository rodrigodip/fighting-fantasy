{{ define "layout" }}
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fighting Fantasy</title>
	<script src="https://unpkg.com/htmx.org@1.9.10"></script>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, sans-serif;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #1a1a2e;
			color: #eee;
		}

		.container {
			max-width: 400px;
			width: 100%;
			padding: 2rem;
		}

		h1 {
			text-align: center;
			margin-bottom: 2rem;
			color: #e94560;
		}

		.auth-buttons {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		button {
			padding: 0.75rem 1.5rem;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 1rem;
			transition: background 0.2s;
		}

		.btn-login {
			background: #e94560;
			color: white;
		}

		.btn-login:hover {
			background: #ff6b6b;
		}

		.btn-register {
			background: transparent;
			border: 2px solid #e94560;
			color: #e94560;
		}

		.btn-register:hover {
			background: #e94560;
			color: white;
		}

		#auth-form {
			margin-top: 2rem;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		input {
			padding: 0.75rem;
			border: 1px solid #444;
			border-radius: 4px;
			background: #16213e;
			color: #eee;
		}

		input:focus {
			outline: none;
			border-color: #e94560;
		}

		.form-buttons {
			display: flex;
			gap: 0.5rem;
		}

		.form-buttons button {
			flex: 1;
		}
	</style>
	<title>{{ block "title" . }}App{{ end }}</title>
</head>

<body>
	{{ block "content" . }}{{ end }}
</body>

</html>
{{ end }}
