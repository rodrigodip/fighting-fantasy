<!-- login-form.html -->
{{ define "login-form.html" }}
<form hx-post="/login" hx-target="#response">
	<style>
		form {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		input {
			padding: 0.75rem;
			border: 1px solid #444;
			border-radius: 4px;
			background: #16213e;
			color: #eee;
		}

		input:focus {
			outline: none;
			border-color: #e94560;
		}

		.form-buttons {
			display: flex;
			gap: 0.5rem;
		}

		.form-buttons button {
			flex: 1;
		}
	</style>

	<input type="email" name="email" placeholder="Email" required />
	<input type="password" name="password" placeholder="Password" required />

	<div class="form-buttons">
		<button type="submit" class="btn-login">Login</button>
		<button type="button" class="btn-register" hx-get="/" hx-target="body">Cancel</button>
	</div>
</form>
<div id="response"></div>
{{ end }}
