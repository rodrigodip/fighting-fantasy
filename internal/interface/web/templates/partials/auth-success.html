{{ define "auth-success" }}
<style>
	:root {
		--color-danger: #dc2626;
		--color-danger-strong: #b91c1c;
		--color-danger-soft: #fef2f2;
		--color-danger-subtle: #fecaca;
		--color-danger-medium: #f87171;
		--color-fg-danger: #dc2626;
		--color-fg-danger-strong: #991b1b;
	}

	.bg-danger-soft {
		background-color: var(--color-danger-soft);
	}

	.bg-danger {
		background-color: var(--color-danger);
	}

	.bg-danger-strong {
		background-color: var(--color-danger-strong);
	}

	.border-danger {
		border: 1px solid var(--gold-dark);
	}

	.text-fg-danger {
		color: var(--gold-dark);
	}

	.focus\:ring-danger-medium:focus {
		--tw-ring-color: var(--color-danger-medium);
	}

	.rounded-base {
		border-radius: 0.375rem;
	}
</style>

{{ if .Success }}
<!-- Blue alert -->
<div id="toast-danger" role="alert" aria-live="assertive"
	class="flex sm:items-center glass-card border-danger p-4 mt-4 text-base text-fg-danger rounded-base">
	<svg class="w-4 h-4 shrink-0 mt-0.5 md:mt-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
		height="24" fill="none" viewBox="0 0 24 24">
		<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
			d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
	</svg>
	<span class="sr-only">Info</span>
	<div class="ms-2 text-sm">
		{{ .Success }}
	</div>
	<button type="button" onclick="this.closest('form') && this.closest('form').reset(); 
			document.getElementById('toast-danger').remove();"
		class="ms-auto -mx-1.5 -my-1.5 rounded focus:ring-2 focus:ring-danger-medium hover:bg-danger-soft inline-flex items-center justify-center h-8 w-8 shrink-0 shrink-0"
		data-dismiss-target="#alert-1" aria-label="Close">
		<span class="sr-only">Close</span>
		<svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
			fill="none" viewBox="0 0 24 24">
			<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
				d="M6 18 17.94 6M18 18 6.06 6" />
		</svg>
	</button>
</div>
{{ end }}
{{end}}
